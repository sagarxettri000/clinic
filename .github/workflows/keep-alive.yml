name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping warm endpoint
        run: |
          for i in 1 2 3; do
            curl -sf "https://clinic-oalxk3jsa-lakd.vercel.app/api/health/warm" || true
            sleep 2
          done
