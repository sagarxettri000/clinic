name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Quality (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  api-tests:
    name: API tests (live DB)
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Verify migrations apply cleanly
        run: npx prisma migrate deploy
      - run: npm run build
      - name: Start server
        run: |
          npm start > /tmp/server.log 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:3002/api/auth/me; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready" >&2
          tail -200 /tmp/server.log >&2
          exit 1
      - name: Run API tests
        run: npm run test:api
      - name: Stop server
        if: always()
        run: kill "$PID" || true
      - name: Show server log on failure
        if: failure()
        run: tail -200 /tmp/server.log
